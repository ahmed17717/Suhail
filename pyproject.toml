[project]
name = "suhail"
version = "1.0.0"
description = "On-premise, Arabic-first RAG assistant for internal documents"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["suhail"]
omit = ["suhail/ui/*", "suhail/bootstrap.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Arabic text legitimately contains "ambiguous" characters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
